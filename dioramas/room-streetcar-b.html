<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>streetcar-b</title>
<style>
  html,body{margin:0;height:100%;background:#17140f;overflow:hidden}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
globalThis.DIORAMA_TEXTURE=Object.assign({"dotVar": 0.3, "dotJit": 0.3, "speckle": 0.3, "angleSpread": 0, "cell": 0.8},globalThis.DIORAMA_TEXTURE||{});
'use strict';
/* ==========================================================================
   DIORAMA RUNTIME  —  a printed isometric room
   Part 1: numbers, geometry, and the press.
   ========================================================================== */
const TAU=Math.PI*2;

/* --- seeded randomness: every mark is deterministic, so art never re-rolls --- */
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hmix(h,v){h=Math.imul(h^(v|0),0x85EBCA6B);h^=h>>>13;h=Math.imul(h,0xC2B2AE35);return(h^(h>>>16))>>>0}
function strHash(s){let h=0x811C9DC5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function streamOf(...ks){let h=0x9E3779B9;for(const k of ks)h=hmix(h,typeof k==='string'?strHash(k):k);const f=mul32(h);for(let i=0;i<11;i++)f();return f}
const rd=(R,a,b)=>a+R()*(b-a);
const ri=(R,a,b)=>Math.floor(rd(R,a,b+1));
const ch=(R,p)=>R()<p;
const pk=(R,arr)=>arr[(R()*arr.length)|0];

/* --- easing: the whole choreography language is sstep + bump --- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t*t*(3-2*t);
const sstep=(a,b,t)=>sm(clamp((t-a)/((b-a)||1),0,1));   // ramp 0->1 between times a and b
const bump=(a,b,u)=>u<=a||u>=b?0:Math.sin((u-a)/(b-a)*Math.PI); // 0->1->0 between a and b
const fract=v=>v-Math.floor(v);
const tri=t=>1-Math.abs(fract(t)*2-1);

/* --- polygons. every drawable is an array of [x,y] --- */
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const ell=(x,y,rx,ry,n=24)=>{const P=[];for(let k=0;k<n;k++){const a=k/n*TAU;P.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return P};
const circ=(x,y,r,n=24)=>ell(x,y,r,r,n);
const arcPts=(x,y,rx,ry,a0,a1,n=12)=>{const P=[];for(let k=0;k<=n;k++){const a=lerp(a0,a1,k/n);P.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return P};
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const bbox=P=>{let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const p of P){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}return[x0,y0,x1,y1]};
const centroid=P=>{let x=0,y=0;for(const p of P){x+=p[0];y+=p[1]}return[x/P.length,y/P.length]};
const sc=(P,cx,cy,k)=>P.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]);
const tr=(P,dx,dy)=>P.map(p=>[p[0]+dx,p[1]+dy]);
const rotPts=(P,cx,cy,a)=>P.map(p=>{const dx=p[0]-cx,dy=p[1]-cy;return[cx+dx*Math.cos(a)-dy*Math.sin(a),cy+dx*Math.sin(a)+dy*Math.cos(a)]});
function pip(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];
if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/((b[1]-a[1])||1e-9)+a[0])c=!c}return c}
function resample(pts,step){
if(pts.length<2)return pts.slice();
const out=[[pts[0][0],pts[0][1]]];let need=step;
for(let i=1;i<pts.length;i++){
let x0=pts[i-1][0],y0=pts[i-1][1];const x1=pts[i][0],y1=pts[i][1];
let d=Math.hypot(x1-x0,y1-y0);
while(d>=need&&d>0){const t=need/d;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push([x0,y0]);d-=need;need=step}
need-=d}
const L=pts[pts.length-1];out.push([L[0],L[1]]);return out}
function chaikin(P,n=2,closed=false){
for(let k=0;k<n;k++){const q=[];const m=P.length;
if(!closed)q.push(P[0]);
for(let i=0;i<(closed?m:m-1);i++){const a=P[i],b=P[(i+1)%m];
q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}
if(!closed)q.push(P[m-1]);P=q}return P}
const curve=(P,n=2)=>chaikin(P,n,false);
const loop=(P,n=2)=>chaikin(P,n,true);
function ribbon(pts,w){
const n=pts.length,L=[],Rr=[];
for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
let nx=-(b[1]-a[1]),ny=b[0]-a[0];const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
const ww=(typeof w==='function'?w(n>1?i/(n-1):0):w)/2;
L.push([pts[i][0]+nx*ww,pts[i][1]+ny*ww]);Rr.push([pts[i][0]-nx*ww,pts[i][1]-ny*ww])}
return L.concat(Rr.reverse())}

/* --- the isometric projection. this is the entire "3D". ---
   i runs south-east, j runs south-west, z runs up. 2:1 dimetric. */
const TW=64,TH=32,TZ=32;
const isoX=(i,j)=>(i-j)*(TW/2);
const isoY=(i,j,z)=>(i+j)*(TH/2)-(z||0)*TZ;

/* --- the press: five plates, screen angles, misregistration --- */
const PAPER=[243,235,221];
const INK={blue:[52,74,128],coral:[238,104,82],sun:[255,212,40],teal:[0,140,138],paper:PAPER};
const INK_NAMES=['blue','coral','sun','teal','paper'];
const SCREEN={blue:15,coral:75,sun:0,teal:45,paper:45};        // halftone angle per plate
const PLATE={blue:[.55,-.3],coral:[-.6,.45],sun:[.35,.75],teal:[-.45,-.55],paper:[0,0]}; // plate slip
const CELLW=3.1,PAT_K=5,PAT_CELLS=8,TONE_LEVELS=20;
const TEX=(globalThis.DIORAMA_TEXTURE=globalThis.DIORAMA_TEXTURE||{});
const texK=()=>TEX.patK??PAT_K;
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const PAPER_RGB=rgb(PAPER),NO_DASH=[];

const PATTERN_CANVAS=new Map();
function patternCanvas(ink,level,variant){
const PK=texK(),key=ink+'|'+level+'|'+variant+'|'+PK;let cv=PATTERN_CANVAS.get(key);if(cv)return cv;
const cell=CELLW*PK,size=Math.round(cell*PAT_CELLS),dv=TEX.dotVar??1,dj=(TEX.dotJit??1)*PK/PAT_K;
cv=document.createElement('canvas');cv.width=size;cv.height=size;
const c=cv.getContext('2d'),col=rgb(INK[ink]),tone=level/TONE_LEVELS;
const R=streamOf('screen',ink,level,variant);
c.fillStyle=col;
if(level>=TONE_LEVELS){c.fillRect(0,0,size,size)}
else if(tone<=.5){
for(let y=0;y<PAT_CELLS;y++)for(let x=0;x<PAT_CELLS;x++){
const r=cell*Math.sqrt(tone/Math.PI)*(.98+(rd(R,.86,1.1)-.98)*dv);
c.beginPath();c.arc((x+.5)*cell+rd(R,-.4,.4)*dj,(y+.5)*cell+rd(R,-.4,.4)*dj,r,0,TAU);c.fill()}
}else{
c.fillRect(0,0,size,size);c.globalCompositeOperation='destination-out';
for(let y=0;y<=PAT_CELLS;y++)for(let x=0;x<=PAT_CELLS;x++){
const r=cell*Math.sqrt((1-tone)/Math.PI)*(.98+(rd(R,.86,1.1)-.98)*dv);
c.beginPath();c.arc(x*cell,y*cell,r,0,TAU);c.fill()}
c.globalCompositeOperation='source-over'}
if(ink!=='paper'){ // ink speckle: the press is not clean
c.globalCompositeOperation='destination-out';
const S5=CELLW*PAT_K*PAT_CELLS,n=Math.round(S5*S5/(level>=TONE_LEVELS?120:230)*(TEX.speckle??1));
for(let k=0;k<n;k++){const s=rd(R,.6,1.8)*(R()<.08?2.2:1)*PK/PAT_K;c.globalAlpha=rd(R,.25,.9);c.fillRect(R()*size,R()*size,s,s)}
c.globalAlpha=1;c.globalCompositeOperation='source-over'}
PATTERN_CANVAS.set(key,cv);return cv}

let MARKS=0;
const PATTERNS=new WeakMap();
function inkPattern(ctx,ink,tone,variant,dx=0,dy=0){
let bank=PATTERNS.get(ctx);if(!bank){bank=new Map();PATTERNS.set(ctx,bank)}
const level=clamp(Math.round(tone*TONE_LEVELS),1,TONE_LEVELS),key=ink+'|'+level+'|'+variant+'|'+texK()+'|'+(TEX.cell??1)+'|'+(TEX.angleSpread??1);
let p=bank.get(key);
if(!p){p=ctx.createPattern(patternCanvas(ink,level,variant),'repeat');
if(p.setTransform)p.setTransform(new DOMMatrix().translateSelf(dx,dy).rotateSelf(45+((SCREEN[ink]||0)-45)*(TEX.angleSpread??1)).scaleSelf((TEX.cell??1)/texK()));
bank.set(key,p)}
return p}

/* ==========================================================================
   Part 2: H — the hand. Every mark goes through here.
   H never knows what it is drawing, only which plate and how dark.
   ========================================================================== */
function mkHand(o={}){
const H={};
let cx=o.ctx||null;
const ox=o.ox||0,oy=o.oy||0;
const boil=o.boil||0,variant=((boil%3)+3)%3;
H.ox=ox;H.oy=oy;H.boil=boil;H.variant=variant;
const RB=streamOf(boil,'boil');H.RB=RB;

/* every plate sits slightly off-register, re-jittered per boil frame */
const jit={};
for(const k of INK_NAMES){const J=streamOf('plate',k,variant);jit[k]=[PLATE[k][0]+rd(J,-.3,.3),PLATE[k][1]+rd(J,-.3,.3)]}
H.plate=k=>jit[k]||[0,0];
H.bind=c=>{cx=c};H.ctx=()=>cx;

const path=(c,P,dx=0,dy=0)=>{c.beginPath();for(let i=0;i<P.length;i++){i?c.lineTo(P[i][0]+dx,P[i][1]+dy):c.moveTo(P[i][0]+dx,P[i][1]+dy)}c.closePath()};

/* world -> page. the only place iso maths is used. */
H.p=(i,j,z)=>[isoX(i,j)+ox,isoY(i,j,z)+oy];
H.iso=H.p;
H.tile =(i,j,w,d,z)=>[H.p(i,j,z),H.p(i+w,j,z),H.p(i+w,j+d,z),H.p(i,j+d,z)];
H.faceI=(i,j,len,z0,z1)=>[H.p(i,j,z0),H.p(i+len,j,z0),H.p(i+len,j,z1),H.p(i,j,z1)];
H.faceJ=(i,j,len,z0,z1)=>[H.p(i,j,z0),H.p(i,j+len,z0),H.p(i,j+len,z1),H.p(i,j,z1)];
H.path=pts=>pts.map(p=>H.p(p[0],p[1],p[2]||0));

const printInk=(c,ink,tone,draw)=>{
MARKS++;
const k=typeof ink==='string'&&INK[ink]?ink:'blue';
const j=jit[k];
if(k!=='paper')c.globalCompositeOperation='multiply';
draw(inkPattern(c,k,tone,variant,j[0],j[1]),j[0],j[1]);
if(k!=='paper')c.globalCompositeOperation='source-over'};

/* knock = print paper-white first, so ink underneath does not show through.
   tint  = lay one plate over whatever is there (multiply).
   fill  = knock then tint. this is literally how a screenprint works. */
H.knock=(P,a=1)=>{if(P.length<3)return;MARKS++;path(cx,P);cx.fillStyle=a===1?PAPER_RGB:rgb(PAPER,a);cx.fill()};
H.tint=(P,ink,tone=1)=>{if(P.length<3||tone<=0)return;printInk(cx,ink,tone,(st,dx,dy)=>{path(cx,P,dx,dy);cx.fillStyle=st;cx.fill()})};
H.fill=(P,ink,tone=1,o2={})=>{if(P.length<3)return;if(o2.knock!==false)H.knock(P);if(tone>0)H.tint(P,ink,tone)};
H.fill2=(P,ink,tone,ink2,tone2)=>{H.fill(P,ink,tone);H.tint(P,ink2,tone2)};
H.erase=P=>{cx.globalCompositeOperation='destination-out';path(cx,P);cx.fillStyle='#000';cx.fill();cx.globalCompositeOperation='source-over'};

/* banded gradient. real gradients look digital; bands look printed. */
H.grad=(P,ink,t0,t1,a,b,n=10)=>{
if(P.length<3)return;
const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux,W=4000;
cx.save();path(cx,P);cx.clip();
for(let k=0;k<n;k++){
const s0=k/n*L-(k?0:W),s1=(k+1)/n*L+(k===n-1?W:0),t=lerp(t0,t1,(k+.5)/n);
if(t<=.02)continue;
const B=[[a[0]+ux*s0+nx*W,a[1]+uy*s0+ny*W],[a[0]+ux*s1+nx*W,a[1]+uy*s1+ny*W],[a[0]+ux*s1-nx*W,a[1]+uy*s1-ny*W],[a[0]+ux*s0-nx*W,a[1]+uy*s0-ny*W]];
printInk(cx,ink,t,(st,jx,jy)=>{path(cx,B,jx,jy);cx.fillStyle=st;cx.fill()})}
cx.restore()};

const rings=(c,ink,x,y,rx,ry,n,toneAt)=>{
for(let k=0;k<n;k++){const f0=k/n,f1=(k+1)/n,t=clamp(toneAt(f0,f1),0,1);if(t<=.03)continue;
printInk(c,ink,t,(st,dx,dy)=>{const X=x+dx,Y=y+dy;c.beginPath();c.ellipse(X,Y,rx*f1,ry*f1,0,0,TAU);
if(k){c.moveTo(X+rx*f0,Y);c.ellipse(X,Y,rx*f0,ry*f0,0,0,TAU,true)}c.fillStyle=st;c.fill('evenodd')})}};
/* glow = coloured halo (sun). light = paper punched back through, i.e. brightness. */
H.glow=(x,y,rx,ry,ink='sun',tone=.6,n=7)=>{if(tone<=.02||rx<=0)return;rings(cx,ink,x,y,rx,ry,n,(f0,f1)=>tone*Math.pow(1-(f0+f1)/2,1.3))};
H.light=(x,y,rx,ry,strength=1,n=7)=>{if(strength<=.02||rx<=0)return;rings(cx,'paper',x,y,rx,ry,n,(f0,f1)=>strength*(1.35-(f0+f1)/2*1.35))};

/* wobble: no straight line is ever straight. this is what sells "drawn". */
H.wob=(rs,amp)=>{
const n=rs.length,q=new Array(n);
const P1=rd(RB,0,7),P2=rd(RB,0,7),F1=rd(RB,1.4,3),F2=rd(RB,5,9);
for(let i=0;i<n;i++){const t=n>1?i/(n-1):0;const A=rs[i>0?i-1:0],B=rs[i<n-1?i+1:n-1];
let nx=-(B[1]-A[1]),ny=B[0]-A[0];const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;
const off=amp*(.65*Math.sin(t*F1*2+P1)+.35*Math.sin(t*F2+P2));
q[i]=[rs[i][0]+nx*off+rd(RB,-.12,.12),rs[i][1]+ny*off+rd(RB,-.12,.12)]}
return q};

H.line=(R,pts,ink='blue',w=1.4,o2={})=>{
if(!pts||pts.length<2)return;
const src=o2.closed?pts.concat([pts[0]]):pts;
const rs=resample(src,Math.max(2.5,w*1.4));if(rs.length<2)return;
const amp=o2.amp??Math.min(.8,w*.18+.2);
const q=amp>0?H.wob(rs,amp):rs;
const tone=o2.tone??1,taper=o2.taper;
if(taper){
const P=ribbon(q,t=>{let e=taper==='out'?.2+.8*(1-t):taper==='in'?.2+.8*t:.25+.75*Math.min(1,Math.min(t,1-t)/.25);return Math.max(.3,w*e)});
printInk(cx,ink,tone,(st,dx,dy)=>{path(cx,P,dx,dy);cx.fillStyle=st;cx.fill()});return}
const dash=o2.dash;
printInk(cx,ink,tone,(st,dx,dy)=>{
cx.strokeStyle=st;cx.lineWidth=w;cx.lineCap=o2.cap||'round';cx.lineJoin='round';if(dash)cx.setLineDash(dash);
cx.beginPath();cx.moveTo(q[0][0]+dx,q[0][1]+dy);for(let i=1;i<q.length;i++)cx.lineTo(q[i][0]+dx,q[i][1]+dy);
cx.stroke();if(dash)cx.setLineDash(NO_DASH)})};
H.outline=(R,P,ink='blue',w=1.3,o2={})=>H.line(R,P,ink,w,{...o2,closed:true});
H.dot=(x,y,r,ink='blue',tone=1,o2={})=>{const P=circ(x,y,r,Math.max(8,Math.round(r*2)));o2.knock?H.fill(P,ink,tone):H.tint(P,ink,tone)};
H.hatch=(R,P,ink,sp,ang,w=.9,o2={})=>{
const [x0,y0,x1,y1]=bbox(P),cxm=(x0+x1)/2,cym=(y0+y1)/2,D=Math.hypot(x1-x0,y1-y0)/2+4;
const dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx;
H.clip(P,()=>{for(let s=-D;s<=D;s+=sp){if(o2.skip&&R()<o2.skip)continue;const px=cxm+nx*s,py=cym+ny*s;
H.line(R,[[px-dx*D,py-dy*D],[px+dx*D,py+dy*D]],ink,w,{amp:o2.amp??.3,tone:o2.tone})}})};
H.speckle=(R,P,ink,n,r0=.6,r1=1.4,tone=1)=>{
const [x0,y0,x1,y1]=bbox(P),dots=[];
for(let k=0;k<n;k++){const x=rd(R,x0,x1),y=rd(R,y0,y1);if(pip(P,x,y))dots.push([x,y,rd(R,r0,r1)])}
printInk(cx,ink,tone,(st,dx,dy)=>{cx.fillStyle=st;cx.beginPath();
for(const d of dots){cx.moveTo(d[0]+d[2]+dx,d[1]+dy);cx.arc(d[0]+dx,d[1]+dy,d[2],0,TAU)}cx.fill()})};
H.clip=(P,fn)=>{cx.save();path(cx,P);cx.clip();try{return fn()}finally{cx.restore()}};
H.opacity=(a,fn)=>{a=clamp(a,0,1);if(a<=0)return;if(a>=1)return fn();cx.save();cx.globalAlpha*=a;try{return fn()}finally{cx.restore()}};

/* H.at defers a piece of drawing until depth-sort time.
   key = i + j + z/1000 is the whole painter's algorithm. */
H.pieces=[];
H.at=(i,j,z,fn)=>{H.pieces.push({key:i+j+(z||0)*.001,fn})};
return H}

/* ==========================================================================
   Part 3: the kit. Shared furniture so a new room is mostly assembly.
   ========================================================================== */
function shadowAt(H,x,y,rx,ry,tone=.22){H.tint(ell(x,y,rx,ry),'blue',tone)}
function shadowBox(H,i,j,w,d,z,h,tone=.2){const k=Math.min(h,2)*.45;
H.tint([H.p(i+k,j+k*.5,z),H.p(i+w+k,j+k*.5,z),H.p(i+w+k,j+d+k*.5,z),H.p(i+k,j+d+k*.5,z)].map(p=>[p[0]+5,p[1]+3]),'blue',tone)}

/* the floor plate, with its cut edge showing thickness */
function slab(H,R,rm,o={}){
const w=rm.w,d=rm.d,th=o.th??.4;
const top=H.tile(0,0,w,d,0),se=H.faceJ(w,0,d,-th,0),sw=H.faceI(0,d,w,-th,0);
H.fill(se,o.edgeInk||'blue',o.edgeTone??.62);
H.fill(sw,o.edgeInk||'blue',(o.edgeTone??.62)*.62);
H.fill(top,o.ink||'sun',o.tone??0);
if(o.ink2)H.tint(top,o.ink2,o.tone2??.1);
H.outline(R,top,'blue',1,{tone:.85,amp:.3});
H.line(R,[se[0],se[1],se[2]],'blue',1,{tone:.85,amp:.25});
H.line(R,[sw[0],sw[3],sw[2]],'blue',1,{tone:.85,amp:.25});
return top}

const wallPt=(H,side,pos,z,off=0)=>side==='ne'?H.p(pos,-off,z):H.p(-off,pos,z);
const wallRect=(H,side,p0,p1,z0,z1,off=.02)=>[wallPt(H,side,p0,z0,off),wallPt(H,side,p1,z0,off),wallPt(H,side,p1,z1,off),wallPt(H,side,p0,z1,off)];

/* the two walls you can see. nw is the left one, ne the right one. */
function backWalls(H,R,rm,h,o={}){
const w=rm.w,d=rm.d,ink=o.ink||'coral',tone=o.tone??.25,style=o.style||'plain';
const faces=[];
if(!o.noNW)faces.push(['nw',H.faceJ(0,0,d,0,h),d,o.shadeNW??.17]);
if(!o.noNE)faces.push(['ne',H.faceI(0,0,w,0,h),w,o.shadeNE??.06]);
for(const [side,F,len,shade] of faces){
H.fill(F,ink,tone);if(o.ink2)H.tint(F,o.ink2,o.tone2??.15);
H.clip(F,()=>{
if(style==='plank')for(let p=.7;p<len;p+=.7)H.line(R,[wallPt(H,side,p,0),wallPt(H,side,p,h)],'blue',.8,{tone:.5,amp:.2});
if(style==='stripe')for(let p=0;p<len;p+=1)H.tint(wallRect(H,side,p,p+.5,0,h,0),o.stripeInk||ink,o.stripeTone??.25);
if(style==='tile'){for(let p=0;p<=len;p+=.5)H.line(R,[wallPt(H,side,p,0),wallPt(H,side,p,h)],'blue',.6,{tone:.35,amp:.1});
for(let z=0;z<=h;z+=.5)H.line(R,[wallPt(H,side,0,z),wallPt(H,side,len,z)],'blue',.6,{tone:.35,amp:.1})}
if(style==='panel'){const zc=h*.32;H.line(R,[wallPt(H,side,0,zc),wallPt(H,side,len,zc)],'blue',1.1,{tone:.55,amp:.15});
H.tint(wallRect(H,side,0,len,0,zc,0),'blue',.06)}
if(style==='dots')for(let p=.35;p<len;p+=.7)for(let z=.35;z<h;z+=.7){const [x,y]=wallPt(H,side,p+((z*1.43)%1>.5?.35:0),z);H.dot(x,y,1.8,o.dotInk||'coral',.8)}
H.tint(F,'blue',shade);
H.grad(F,'blue',.18,0,wallPt(H,side,len/2,0),wallPt(H,side,len/2,h*.45),5)})}
/* the floor darkens where it meets a wall — cheap ambient occlusion */
if(!o.noNW)H.grad([H.p(0,0,0),H.p(1.4,1.4,0),H.p(1.4,d,0),H.p(0,d,0)],'blue',.24,0,H.p(0,d/2,0),H.p(1.2,d/2,0),5);
if(!o.noNE)H.grad([H.p(0,0,0),H.p(w,0,0),H.p(w,1.1,0),H.p(1.1,1.1,0)],'blue',.18,0,H.p(w/2,0,0),H.p(w/2,1,0),5);
const th=o.th??.14;
if(!o.noNW){const T=[H.p(0,0,h),H.p(0,d,h),H.p(-th,d,h),H.p(-th,0,h)];H.fill(T,ink,tone*.4);H.outline(R,T,'blue',1,{tone:.9,amp:.2})}
if(!o.noNE){const T=[H.p(0,0,h),H.p(w,0,h),H.p(w,-th,h),H.p(0,-th,h)];H.fill(T,ink,tone*.4);H.outline(R,T,'blue',1,{tone:.9,amp:.2})}
for(const [,F] of faces)H.outline(R,F,'blue',1.1,{tone:.9,amp:.25})}

/* the workhorse. three faces, two tones, one outline. most furniture is this. */
function boxAt(H,R,i,j,w,d,z,h,col,o={}){
const [ink,tone]=Array.isArray(col)?col:[col.ink,col.tone];
if(o.shadow!==false&&h>.05)shadowBox(H,i,j,w,d,z,h,o.shadowTone??.2);
const top=H.tile(i,j,w,d,z+h),se=H.faceJ(i+w,j,d,z,z+h),sw=H.faceI(i,j+d,w,z,z+h);
H.fill(sw,ink,tone);H.tint(sw,'blue',o.half??.2);
H.fill(se,ink,tone);H.tint(se,'blue',o.full??.42);
H.fill(top,o.topInk||ink,o.topTone??tone);
if(o.line!==false){const lw=o.lw??1.1;
H.outline(R,top,'blue',lw,{tone:.9,amp:.2});
H.line(R,[top[3],sw[0],sw[1],se[1],top[2]],'blue',lw,{tone:.9,amp:.2});
H.line(R,[top[2],sw[1]],'blue',lw,{tone:.9,amp:.2})}
return {top,se,sw}}

function rug(H,R,i,j,w,d,ink,tone,o={}){
const P=H.tile(i,j,w,d,o.z||.01);H.fill(P,ink,tone);
if(o.border)H.outline(R,sc(P,...centroid(P),.86),o.border,1.2,{tone:.8});
if(o.line!==false)H.outline(R,P,'blue',.9,{tone:.7});return P}

function windowOn(H,R,side,pos,z,w,h,o={}){
const P=wallRect(H,side,pos-w/2,pos+w/2,z,z+h,.03);
H.fill(P,o.sky||'blue',o.skyTone??.15);
if(o.sky2)H.tint(P,o.sky2,o.sky2Tone??.3);
if(o.inside)H.clip(P,()=>o.inside(P));
const fr=wallRect(H,side,pos-w/2-.08,pos+w/2+.08,z-.08,z+h+.08,.05);
H.outline(R,fr,'blue',1.4,{tone:.9,amp:.2});
H.outline(R,P,'blue',1,{tone:.8,amp:.15});
const bars=o.bars??1;
for(let k=1;k<=bars;k++){const p=pos-w/2+w*k/(bars+1);H.line(R,[wallPt(H,side,p,z,.05),wallPt(H,side,p,z+h,.05)],'blue',1.1,{tone:.85,amp:.1})}
if(o.mullion!==false)H.line(R,[wallPt(H,side,pos-w/2,z+h*.5,.05),wallPt(H,side,pos+w/2,z+h*.5,.05)],'blue',1.1,{tone:.85,amp:.1});
return P}

function doorOn(H,R,side,pos,w,h,o={}){
const P=wallRect(H,side,pos-w/2,pos+w/2,0,h,.03);
H.fill(P,o.ink||'blue',o.tone??.5);
if(o.dark)H.tint(P,'blue',.35);
const fr=wallRect(H,side,pos-w/2-.1,pos+w/2+.1,0,h+.1,.06);
H.outline(R,fr,'blue',1.4,{tone:.9,amp:.2});H.outline(R,P,'blue',1,{tone:.8});
const [kx,ky]=wallPt(H,side,pos+w/2-.22,h*.45,.05);H.dot(kx,ky,2,'sun',.9,{knock:true});
return P}

function frameOn(H,R,side,pos,z,w,h,o={}){
const P=wallRect(H,side,pos-w/2,pos+w/2,z,z+h,.04);
H.fill(P,'paper',1);if(o.ink)H.tint(sc(P,...centroid(P),.78),o.ink,o.tone??.5);
H.outline(R,P,'blue',1.1,{tone:.85,amp:.15});return P}

function shelfOn(H,R,side,p0,p1,z,o={}){
const dep=o.dep??.32,th=.08;
const A=wallPt(H,side,p0,z,0),B=wallPt(H,side,p1,z,0);
const A2=side==='ne'?H.p(p0,-dep,z):H.p(-dep,p0,z),B2=side==='ne'?H.p(p1,-dep,z):H.p(-dep,p1,z);
const top=[A,B,B2,A2];H.fill(top,o.ink||'coral',o.tone??.5);
const front=[A,B,[B[0],B[1]+th*TZ],[A[0],A[1]+th*TZ]];H.fill(front,o.ink||'coral',(o.tone??.5)*1.3);
H.outline(R,top,'blue',1,{tone:.85,amp:.15});H.outline(R,front,'blue',1,{tone:.85,amp:.15});
return top}

function plant(H,R,x,y,s=1,o={}){
const pot=[[x-7*s,y-9*s],[x+7*s,y-9*s],[x+5*s,y],[x-5*s,y]];
H.fill(pot,o.pot||'coral',o.potTone??.7);H.tint([[x,y-9*s],[x+7*s,y-9*s],[x+5*s,y],[x,y]],'blue',.25);
H.outline(R,pot,'blue',1,{amp:.2});
const n=o.n??7;
for(let k=0;k<n;k++){const a=-Math.PI/2+rd(R,-1.15,1.15),L=rd(R,11,22)*s;
const tip=[x+Math.cos(a)*L,y-9*s+Math.sin(a)*L];
const mid=[lerp(x,tip[0],.5)+rd(R,-3,3)*s,lerp(y-9*s,tip[1],.5)+rd(R,-2,2)*s];
const leaf=loop([[x,y-9*s],[mid[0]-2.5*s,mid[1]],tip,[mid[0]+2.5*s,mid[1]]],2);
H.fill(leaf,'teal',rd(R,.55,.85));H.outline(R,leaf,'blue',.8,{tone:.8,amp:.2})}}

function lamp(H,R,x,y,s=1,o={}){
const shade=[[x-9*s,y],[x+9*s,y],[x+5.5*s,y-11*s],[x-5.5*s,y-11*s]];
H.fill(shade,o.ink||'sun',o.tone??.85);H.tint([[x,y],[x+9*s,y],[x+5.5*s,y-11*s],[x,y-11*s]],'blue',.18);
H.outline(R,shade,'blue',1.1,{amp:.2});
if(o.on)H.glow(x,y+3*s,16*s,9*s,'sun',.5)}

function cloud(H,R,x,y,s=12){
const P=[];const n=9;
for(let k=0;k<n;k++){const a=k/n*TAU;const r=s*(.55+.45*Math.abs(Math.sin(a*2.3+1)));
P.push([x+Math.cos(a)*r*1.7,y+Math.sin(a)*r*.62])}
const Q=loop(P,2);H.fill(Q,'paper',1);H.tint(Q,'paper',1);H.outline(R,Q,'blue',1,{tone:.45,amp:.35})}

/* ==========================================================================
   Part 3b: the density kit.

   Richness is a count, not a craft. Hand-placing props does not scale — these
   do. Every one of them produces six to thirty objects from one call. Reach
   for these before you type a second boxAt.
   ========================================================================== */

/* a wobbly closed blob — stains, puddles, piles, scuffs */
function blobAt(R,x,y,rx,ry,n=9){
const P=[];for(let k=0;k<n;k++){const a=k/n*TAU,d=rd(R,.7,1.25);
P.push([x+Math.cos(a)*rx*d,y+Math.sin(a)*ry*d])}
return loop(P,2)}

/* scatter n items inside a polygon — a tabletop, a rug, a patch of floor.
   fn(x,y,k,R) draws one. Items keep clear of the edges. */
function scatterOn(H,R,P,n,fn,inset=.82){
const [x0,y0,x1,y1]=bbox(P),c=centroid(P),Q=sc(P,c[0],c[1],inset);
let placed=0,guard=0;
while(placed<n&&guard++<n*40){
const x=rd(R,x0,x1),y=rd(R,y0,y1);
if(!pip(Q,x,y))continue;
fn(x,y,placed,R);placed++}
return placed}

/* a stack of thin things — paper, plates, trays, folded cloth — with drift */
function stackOf(H,R,i,j,w,d,z,n,fn,step=.014){
for(let k=0;k<n;k++)fn(H.tile(i+rd(R,-.014,.014),j+rd(R,-.012,.012),w,d,z+k*step),k,R)}

/* a run of book spines, box files, bottles. One call is a whole shelf,
   including the gaps where somebody took one out. */
function booksAlong(H,R,axis,i,j,len,z,dep,o={}){
const inks=o.inks||['teal','coral','blue','sun'];
let p=0,n=0;
while(p<len-.05){
const bw=rd(R,o.w0??.09,o.w1??.17),bh=rd(R,o.h0??.20,o.h1??.38);
if(p+bw>len)break;
if(ch(R,o.gap??.09)){p+=bw;continue}
const [bi,bj]=axis==='i'?[i+p,j]:[i,j+p];
const [bw2,bd2]=axis==='i'?[bw,dep]:[dep,bw];
boxAt(H,R,bi,bj,bw2,bd2,z,bh,[pk(R,inks),rd(R,.45,.9)],{lw:.6,shadow:false});
p+=bw;n++}
return n}

/* paper pinned to a wall: notices, a rota, photos, someone's kid's drawing */
function notesOn(H,R,side,p0,p1,z0,z1,n,o={}){
const inks=o.inks||['paper','coral','teal','sun'],off=o.off??.05;
for(let k=0;k<n;k++){
const w=rd(R,o.w0??.13,o.w1??.22),h=w*rd(R,.7,1.25);
const p=rd(R,p0,Math.max(p0,p1-w)),z=rd(R,z0,Math.max(z0,z1-h));
const N=wallRect(H,side,p,p+w,z,z+h,off);
H.fill(N,pk(R,inks),rd(R,.5,1));
H.outline(R,N,'blue',.6,{tone:.6,amp:.25});
if(ch(R,.5))for(let l=1;l<3;l++)
H.line(R,[lerpP(N[0],N[3],l/3),lerpP(N[1],N[2],l/3)],'blue',.45,{tone:.3,amp:.06});
const [px,py]=wallPt(H,side,p+w/2,z+h*.94,off+.01);
H.dot(px,py,.85,pk(R,['coral','teal','sun']),.95)}}

/* a cord that droops between two page-space points */
function cableBetween(H,R,a,b,sag=14,o={}){
const pts=[],n=o.n??10;
for(let k=0;k<=n;k++){const u=k/n;
pts.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)+Math.sin(u*Math.PI)*sag])}
H.line(R,curve(pts,2),o.ink||'blue',o.w??1.1,{tone:o.tone??.75,amp:.25})}

/* open shelving. fn(z,row,R) fills each shelf — usually with booksAlong. */
function shelvingAt(H,R,i,j,w,d,h,rows,fn,o={}){
const ink=o.ink||'blue',tone=o.tone??.7;
shadowBox(H,i,j,w,d,0,h,.2);
for(const [a,b] of[[i,j],[i+w-.1,j],[i,j+d-.1],[i+w-.1,j+d-.1]])
boxAt(H,R,a,b,.1,.1,0,h,[ink,tone],{shadow:false,lw:.7});
for(let r=0;r<rows;r++){const z=h*(r+.12)/rows;
boxAt(H,R,i,j,w,d,z,.05,[o.shelfInk||'paper',1],{topInk:o.topInk||'sun',topTone:.22,shadow:false,lw:.7});
if(fn)fn(z+.05,r,R)}}

/* a pipe or conduit running along a wall, with collars */
function pipeRun(H,R,side,p0,p1,z,o={}){
const off=o.off??.10,w=o.w??3.2;
const a=wallPt(H,side,p0,z,off),b=wallPt(H,side,p1,z,off);
H.line(R,[a,b],o.ink||'blue',w,{tone:o.tone??.55,amp:.08});
H.line(R,[a,b],'paper',w*.28,{tone:.3,amp:.08});
for(let p=p0+.5;p<p1;p+=rd(R,1.3,2.6)){
const c=wallPt(H,side,p,z,off+.02);H.fill(circ(c[0],c[1],w*.62),'blue',.85)}}

/* --- the small props you will otherwise rewrite in every room --- */
function mugAt(H,R,x,y,ink='coral',tone=.6,s=1){
const M=rect(x-4*s,y-8*s,x+4*s,y);
H.fill(M,'paper',1);if(ink!=='paper')H.tint(M,ink,tone);
H.outline(R,M,'blue',.8);
H.fill(ell(x,y-8*s,4*s,1.5*s),'blue',.55);
H.line(R,arcPts(x+4*s,y-4.5*s,3*s,2.6*s,-1.5,1.5,6),'blue',.8)}

function bottleAt(H,R,x,y,s=1,ink='teal',tone=.5){
const b=[[x-4*s,y],[x+4*s,y],[x+3.6*s,y-11*s],[x+1.4*s,y-15*s],
         [x+1.4*s,y-20*s],[x-1.4*s,y-20*s],[x-1.4*s,y-15*s],[x-3.6*s,y-11*s]];
H.fill(b,ink,tone);
H.tint([[x,y],[x+4*s,y],[x+3.6*s,y-11*s],[x+1.4*s,y-15*s],[x,y-15*s]],'blue',.2);
H.outline(R,b,'blue',.9,{amp:.2});
H.fill(rect(x-1.5*s,y-22*s,x+1.5*s,y-19.5*s),'coral',.8)}

function paperAt(H,R,i,j,w,d,z,o={}){
const P=H.tile(i,j,w,d,z);
H.fill(P,'paper',1);if(o.ink)H.tint(P,o.ink,o.tone??.3);
H.outline(R,P,'blue',.6,{tone:.75,amp:.12});
const n=o.lines??3;
for(let k=1;k<=n;k++)H.line(R,[lerpP(P[0],P[3],k/(n+1)),lerpP(P[1],P[2],k/(n+1))],'blue',.5,{tone:.35,amp:.06});
return P}

/* wear. Rooms read as inhabited almost entirely because of these. */
function scuffOn(H,R,P,n=6,o={}){
const [x0,y0,x1,y1]=bbox(P);
H.clip(P,()=>{for(let k=0;k<n;k++){
const x=rd(R,x0,x1),y=rd(R,y0,y1);
if(!pip(P,x,y))continue;
const r=rd(R,o.r0??5,o.r1??16);
H.tint(blobAt(R,x,y,r,r*.5),o.ink||'blue',rd(R,.04,o.tone??.11))}})}

const vec=(deg,len)=>[Math.sin(deg*Math.PI/180)*len,Math.cos(deg*Math.PI/180)*len];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const rotate=(p,deg)=>{const a=deg*Math.PI/180;return[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)]};

function sample(name,phase){

const BODIES={

function skeleton(p,q){

const facing=(di,dj,prev='se')=>Math.hypot(di,dj)<1e-6?prev:(Math.abs(di)>=Math.abs(dj)?(di>=0?'se':'nw'):(dj>=0?'sw':'ne'));

function state(fig,t){

/* ==========================================================================
   Part 5: the runtime. Bake what never moves, redraw what does.
   under + over are baked once per (boil variant, zoom bucket).
   live + figures are redrawn every frame.
   ========================================================================== */
function mount(rm,canvas){
const stage=canvas,ctx=stage.getContext('2d',{alpha:false});
const ERRORS=[];
{const ce=console.error;console.error=function(...a){ERRORS.push(a.map(x=>x&&x.stack?String(x.message||x):String(x)).join(' ').slice(0,180));ce.apply(console,a)};
addEventListener('error',e=>ERRORS.push('window: '+e.message));}
/* ?t=8.6 freezes the clock on one beat. ?zoom= and ?focus=i,j aim the camera.
   You will use these constantly while tuning a loop. */
const qs=new URLSearchParams(location.search);
const frozenT=qs.has('t')?parseFloat(qs.get('t')):null;
let dpr=1,W=0,Hh=0;
const WALL=rm.wall??3.2;
/* page bounds of the room, in local coordinates */
const B={x0:-rm.d*TW/2-60,y0:-WALL*TZ-90,x1:rm.w*TW/2+60,y1:(rm.w+rm.d)*TH/2+90};
const RW=B.x1-B.x0,RH=B.y1-B.y0;
const cam={x:(B.x0+B.x1)/2,y:(B.y0+B.y1)/2,zoom:1};
const MINZ=.25,MAXZ=6,BUCKETS=[.75,1.5,3,5];

/* ---- the paper the room is printed on ---- */
let sheet=null;
function buildSheet(){
const k=.3,pad=340,b={x0:B.x0-pad,y0:B.y0-pad*.8,x1:B.x1+pad,y1:B.y1+pad};
const cv=document.createElement('canvas');
cv.width=Math.ceil((b.x1-b.x0)*k);cv.height=Math.ceil((b.y1-b.y0)*k);
const c=cv.getContext('2d');c.fillStyle=rgb(PAPER);c.fillRect(0,0,cv.width,cv.height);
const R=streamOf('stock');
for(let n=0;n<cv.width*cv.height/60;n++){const x=R()*cv.width,y=R()*cv.height;
c.fillStyle=R()<.5?'rgba(255,255,255,.35)':'rgba(120,96,70,.07)';c.fillRect(x,y,R()*2+.5,R()*1.2+.4)}

/* ---- bake cache ---- */
const baked=new Map();
function layer(name,variant,bucket){
const key=name+'|'+variant+'|'+bucket+'|'+dpr;
let e=baked.get(key);if(e)return e;
if(typeof rm[name]!=='function'){e={absent:true};baked.set(key,e);return e}
const ratio=Math.min(bucket*dpr,4);
const cv=document.createElement('canvas');
cv.width=Math.ceil(RW*ratio);cv.height=Math.ceil(RH*ratio);
const c=cv.getContext('2d');
c.setTransform(ratio,0,0,ratio,-B.x0*ratio,-B.y0*ratio);
const H=mkHand({ctx:c,boil:variant});
const m0=MARKS;
try{rm[name].call(rm,H,streamOf(rm.id,name))}catch(err){console.error(rm.id+' '+name+' '+err.message)}

/* ---- camera ---- */
const toWorld=(x,y)=>({x:cam.x+(x-W/2)/cam.zoom,y:cam.y+(y-Hh/2)/cam.zoom});
function fit(){cam.x=(B.x0+B.x1)/2;cam.y=(B.y0+B.y1)/2;
cam.zoom=clamp(Math.min((W-40)/RW,(Hh-40)/RH),MINZ,MAXZ)}
function aim(){
if(qs.has('zoom'))cam.zoom=clamp(parseFloat(qs.get('zoom')),MINZ,MAXZ);

if(f.length>=2&&f.every(Number.isFinite)){cam.x=isoX(f[0],f[1]);cam.y=isoY(f[0],f[1],f[2]||0)}}

stage.width=rm.__embed?1:Math.round(W*dpr);stage.height=rm.__embed?1:Math.round(Hh*dpr);

/* ---- the frame ---- */
/* the room itself, into a context that is already positioned. frame(), the

function drawScene(c,t,boil,bucket){
const u=fract(t/CYCLE)*CYCLE;

const H=mkHand({ctx:c,boil});

if(typeof rm.live==='function'){try{rm.live.call(rm,H,R,t,u)}catch(err){console.error(rm.id+' live '+err.message)}}
const items=H.pieces.map(p=>({key:p.key,run:()=>p.fn(H)}));
(rm.figures||[]).forEach((fig,k)=>{
try{
const s2=FIGURES.state(fig,t);if(s2.hidden)return;
const [x,y]=H.p(s2.i,s2.j,s2.z),gz=fig.groundZ??s2.groundZ??0;
items.push({key:s2.i+s2.j+s2.z*.001,run:()=>FIGURES.draw(H,streamOf(rm.id,'fig',k,boil),

const CYCLE=rm.cycle||18;

const bucket=bucketFor(cam.zoom);

ctx.drawImage(sheet.canvas,sheet.b.x0,sheet.b.y0,sheet.b.x1-sheet.b.x0,sheet.b.y1-sheet.b.y0);

/* ?sheet=6 renders six beats of the loop side by side. One screenshot instead
   of six navigations — use it instead of stepping ?t= by hand. */
let SHEET=qs.has('sheet')?clamp(parseInt(qs.get('sheet'))||6,2,12):0;
function drawContactSheet(){
const cols=Math.ceil(Math.sqrt(SHEET)),rows=Math.ceil(SHEET/cols);
const tw=W/cols,th=Hh/rows,k=Math.min(tw/RW,th/RH)*.94;
for(let idx=0;idx<SHEET;idx++){
const t=CYCLE*idx/SHEET+.02,cx2=(idx%cols)*tw,cy2=Math.floor(idx/cols)*th;

ctx.fillText('t='+t.toFixed(2),cx2+9,cy2+17)}}

/* ?audit=1 answers the checklist in text, so you do not have to look at it.
   Reads back as globalThis.AUDIT. */
function runAudit(){
const mk=()=>{const cv=document.createElement('canvas');
cv.width=Math.ceil(RW);cv.height=Math.ceil(RH);

c.fillStyle=rgb(PAPER);c.fillRect(0,0,cv.width,cv.height);
c.setTransform(1,0,0,1,-B.x0,-B.y0);return {cv,c}};

drawScene(a.c,.02,0,BUCKETS[0]);                       // warm the bakes first
const baked0=(layer('under',0,BUCKETS[0]).marks||0)+(layer('over',0,BUCKETS[0]).marks||0);
MARKS=0;const shape=drawScene(a.c,.02,0,BUCKETS[0]);

drawScene(b.c,CYCLE-.02,0,BUCKETS[0]);            // end of the loop
drawScene(ctrl.c,CYCLE+.02,0,BUCKETS[0]);         // one whole cycle on: same u, different raw t
const A=a.c.getImageData(0,0,a.cv.width,a.cv.height).data;

               Five commuters at a streetcar stop. The woman on her phone
               leans out past the kerb to look down the track. The car comes,
               takes them, goes. One by one, the next five arrive."

   BEAT SHEET  (cycle 24 s) ............... KING, below
     0.0   all five waiting
     1.5   she steps to the kerb edge, leans out, looks down the track
     1.7   (the car's shadow, thrown ahead of it by the low sun, reaches the tile)
     3.0   the car enters from the east (lower right), slowing; she is back
     3.5   two of them turn to watch it come
     7.0   car stopped; everyone hidden behind it
     8.0   the crowd vanishes (boarded on the far side, heads in the windows)
    10.0   car pulls away, speeding up; the pantograph sparks
    13.5   its tail clears an empty stop
    14.0   the tall one in the toque walks in from the near end
    15.5   the one with the coffee, from the far end
    17.0   the one with the tote, from the near end
    18.5   the student, from the far end
    20.0   the woman on her phone, from the far end
    23.5   all five settled in their opening poses. the loop closes.

   AXES   i runs east (the sun end, lower right), j runs south, away from
          the shops. The sun is low in the east-south-east, so every shadow
          points up-left along the street and a little toward the shops.

   AT TABLE    every position, named ...... AT, CAR, TRK, PEOPLE
   LAYER TABLE
     U  road, track beds, rails, lane lines, manhole, drain, patching, leaves;
        the whole shop front (café, flats door, dry cleaner, the flats above,
        cornice, awning, blade sign, pipes, cables, and the sun and shadow on
        it); the raised sidewalk and everything nobody stands behind: café
        bench and planters, sandwich board, newspaper boxes, the glass shelter
        and its ad panel; every static cast shadow on the ground
     L  the car and its shadow (one key, after every commuter)
        the street tree, the two post-and-ring stands and the locked bike,
        the stop flag, the north trolley pole — people stand behind all four
        the commuters' long shadows, steam from the manhole, motes in the sun
     O  the south kerb: its three trolley poles, streetlights, hydrant,

/* one function answers "where is this person, doing what" for any u */
function route(key,u){
const p=PEOPLE[key],K=KING,[si,sj]=p.spot;

function drawCar(HH,R,u,t){
const F=carFront(u),T=F+CAR.L,{j0,j1,z0,zr}=CAR,D=j1-j0,jc=(j0+j1)/2;

            HH.p(12,j0,30),HH.p(12,j0,zr),HH.p(12,j1,zr),HH.p(12,j1,-.5)];
const vis=(a,b)=>[Math.max(a,0),Math.min(b,12)];
const band=(a,b,z0_,z1_,ink,tone)=>{const [va,vb]=vis(a,b);if(vb-va<.005)return null;
const P=HH.faceI(va,j1+.004,vb-va,z0_,z1_);HH.fill(P,ink,tone);return P};
const boarded=u>=KING.vanish&&u<KING.clear+1;
HH.clip(CLIP,()=>{
/* the dark under the car first */
{const [va,vb]=vis(F,T);if(vb>va)HH.tint(HH.tile(va,j0+.1,vb-va,D-.2,.004),'blue',.38)}
CAR.mods.forEach(([m0,m1,bogie],k)=>{
const a=F+m0,b=F+m1,nose=k===0?1.1:0;
const [va,vb]=vis(a+nose,b);
if(vb-va>.005){
/* wheels behind the skirt on the bogie sections */
if(bogie)for(const w of[(a+b)/2-.85,(a+b)/2+.85])if(w>0&&w<12){
const [wx,wy]=side(w,.30);HH.fill(ell(wx,wy,8,6,12),'blue',.9);HH.dot(wx,wy,1.5,'paper',.6)}
boxAt(HH,R,va,j0,vb-va,D,z0,zr-z0,['coral',.86],{topInk:'coral',topTone:.64,half:.12,full:.04,lw:1.1,shadow:false})}
/* livery on the long side */
band(a+nose,b,z0,.64,'blue',.74);
band(a+nose,b,1.26,1.35,'paper',1);
const W=band(a+nose,b,1.42,2.86,'blue',.9);
if(W){HH.tint(W,'teal',.14);
/* riders: the ones already aboard, and the five who just got on */
for(let n=0,x=a+nose+.55;x<b-.35;n++,x+=.82){
const on=fract(Math.sin(k*91.7+n*37.3)*43758.5)<.42||(boarded&&k<2&&(n===1||n===3||n===4))||(k===0&&n===0);
if(!on||x<.1||x>11.9)continue;
const [hx,hy]=side(x,2.24);
HH.fill(ell(hx,hy+8,7,4,12),'blue',.75);
HH.fill(ell(hx,hy,3.3,3.8,12),'coral',.55);HH.tint(ell(hx,hy,3.3,3.8,12),'blue',.45)}
/* mullions and the low sun sliding across the glass */
for(let x=a+nose+.4;x<b-.1;x+=1.15)if(x>0&&x<12)HH.line(R,[side(x,1.42),side(x,2.86)],'coral',1.3,{tone:.7,amp:0});
for(let x=a+nose+.3;x<b-.6;x+=1.9)if(x>0&&x<11.4)
HH.line(R,[side(x,1.5),side(x+.55,2.78)],'paper',3.2,{tone:.2,amp:.05})}
HH.line(R,[side(Math.max(a+nose,0),2.9),side(Math.min(b,12),2.9)],'blue',.7,{tone:.5,amp:0});
/* roof pods */
const pods=[[1.8,3.9],[.5,2.0],[2.9,4.9],[.5,2.0],[1.4,3.6]][k];
{const [pa,pb]=vis(a+pods[0],a+pods[1]);if(pb-pa>.05){
boxAt(HH,R,pa,j0+.62,pb-pa,D-1.24,zr,.22,['coral',.35],{topInk:'blue',topTone:.5,half:.12,full:.04,lw:.8,shadow:false});
for(let x=pa+.25;x<pb-.1;x+=.35)HH.line(R,[HH.p(x,j0+.72,zr+.225),HH.p(x,j1-.72,zr+.225)],'blue',.5,{tone:.45,amp:0})}}
/* the articulation bellows to the next section */
if(k<4){const [ba,bb]=vis(b,F+CAR.mods[k+1][0]);if(bb-ba>.01){
boxAt(HH,R,ba,j0+.2,bb-ba,D-.4,.52,3.0,['blue',.72],{topInk:'blue',topTone:.6,half:.1,full:.05,lw:.8,shadow:false});
for(let x=ba+.06;x<bb;x+=.07)HH.line(R,[HH.p(x,j1-.2,.6),HH.p(x,j1-.2,3.45)],'blue',.5,{tone:.9,amp:0})}}
/* route sign and the TTC mark */
if(k===0){const s0=a+1.55,cw=.22;
const bg=band(s0-.08,s0+8*cw*1.35+.02,3.0,3.36,'blue',.95);
if(bg)textAt(HH,R,'504 KING',(x,y)=>side(s0+x*cw,3.06+y*.24),'sun',1.1,.95)}
if(k===2)textAt(HH,R,'TTC',(x,y)=>side(a+2.2+x*.24,.82+y*.3),'paper',1.4,1);
});
/* the nose, in profile, on the far end */
if(F>-1.1&&F<12){
const pro=[[1.1,z0],[.3,z0],[.08,.6],[0,1.3],[.05,2.2],[.28,2.95],[.62,3.45],[1.1,zr]].map(([d,z])=>side(F+d,z));
HH.fill(pro,'coral',.86);HH.tint(pro,'blue',.08);HH.outline(R,pro,'blue',1.1,{amp:.08});
const ws=[[1.1,1.42],[.03,1.42],[.05,2.2],[.27,2.88],[1.1,2.88]].map(([d,z])=>side(F+d,z));
HH.fill(ws,'blue',.9);HH.tint(ws,'teal',.14);
HH.fill([[1.1,z0],[.3,z0],[.1,.55],[1.1,.64]].map(([d,z])=>side(F+d,z)),'blue',.74);
const top=[HH.p(F+.62,j0,3.45),HH.p(F+1.1,j0,zr),HH.p(F+1.1,j1,zr),HH.p(F+.62,j1,3.45)];
HH.fill(top,'coral',.64);HH.outline(R,top,'blue',.9,{amp:.05});
const [lx,ly]=side(F+.1,.95);HH.dot(lx,ly,2.2,'paper',1);HH.glow(lx-6,ly+2,16,8,'paper',.5)}
/* the tail, once it is inside the tile */
if(T<=12&&T>0){
const rw=HH.faceJ(T+.004,j0+.42,D-.84,1.55,2.92);HH.fill(rw,'blue',.9);HH.tint(rw,'teal',.12);HH.outline(R,rw,'blue',.8,{amp:.05});
for(const tj of[j0+.3,j1-.3]){const [x,y]=HH.p(T,tj,.98);HH.dot(x,y,2.4,'coral',1);HH.glow(x,y,10,6,'coral',.5)}
const rs=HH.faceJ(T+.004,j0+.9,D-1.8,3.02,3.34);HH.fill(rs,'blue',.95);
textAt(HH,R,'504',(x,y)=>HH.p(T+.006,j0+1.76-x*.2,3.07+y*.22),'sun',1,.95);
HH.light(...HH.p(T,jc,2),30,40,.10)}
/* the pantograph, up on the wire */
{const ip=F+CAR.panto;if(ip>-.6&&ip<12.6){
const Z=TRK.wire,hinge=zr+.26,knee=[ip+.62,zr+1.02],head=ip-.08;
boxAt(HH,R,ip-.55,jc-.42,.9,.84,zr,.14,['blue',.6],{topInk:'blue',topTone:.5,lw:.7,shadow:false});
for(const dj of[-.2,.2]){
HH.line(R,[HH.p(ip-.4,jc+dj,hinge),HH.p(knee[0],jc+dj*.5,knee[1])],'blue',2.4,{tone:.95,amp:.03});
HH.line(R,[HH.p(knee[0],jc+dj*.5,knee[1]),HH.p(head,jc+dj*.3,Z-.04)],'blue',2,{tone:.95,amp:.03})}
HH.line(R,[HH.p(knee[0],jc-.1,knee[1]),HH.p(knee[0],jc+.1,knee[1])],'blue',2,{tone:.95,amp:0});
HH.line(R,[HH.p(ip-.4,jc,hinge),HH.p(ip+.1,jc,zr+.7)],'paper',1,{tone:.8,amp:0});
HH.line(R,[HH.p(head+.12,jc-.7,Z-.12),HH.p(head,jc-.55,Z-.02),HH.p(head,jc+.55,Z-.02),HH.p(head+.12,jc+.7,Z-.12)],'blue',2.6,{tone:.95,amp:.02});
for(const dj of[-.18,.18])HH.dot(...HH.p(ip-.4,jc+dj,zr+.18),1.6,'paper',1);
/* the arc when she pulls away */
const sp=bump(KING.depart,KING.depart+.9,u);
if(sp>.05&&fract(t*7.3)<.55){const [sx,sy]=HH.p(head,jc,Z);
HH.glow(sx,sy,14,10,'sun',.8*sp);HH.dot(sx,sy,2.4,'paper',1);
for(let k=0;k<5;k++){const a=k/5*TAU+t*3;HH.line(R,[[sx,sy],[sx+Math.cos(a)*7*sp,sy+Math.sin(a)*5*sp]],'sun',.9,{tone:.9,amp:.1})}}}}
});
/* the section where the tile cuts through her */
if(F<12&&T>12){
const inB=CAR.mods.some(([m0,m1])=>12>=F+m0&&12<=F+m1),dj=inB?0:.2,zb=inB?z0:.52,zt=inB?zr:3.52;

HH.fill(HH.faceJ(12.004,j0+.14,D-.28,.62,.74),'paper',1);HH.tint(HH.faceJ(12.004,j0+.14,D-.28,.62,.74),'sun',.3);
for(const sj of[j0+.35,j1-.75])HH.fill(HH.faceJ(12.006,sj,.4,.74,1.5),'teal',.5);
const [px,py]=HH.p(12.006,jc,.74);

for(let x=a+.12;x<b-.1;x+=.13)H.dot(...WP(H,x,z+.05,-.02),1.3,pk(streamOf('king','cups',x*100|0),['paper','teal','coral']),.8)}

for(const f of[.06,.94])H.fill(ell(...H.p(pi,lerp(A[1],B[1],f),spanZ(A,B,f)),1.6,1.6,8),'paper',1)}

H.fill(Bd,ink,ink==='blue'?.6:.7);H.tint(Bd,'blue',.15);H.outline(R,Bd,'blue',.7,{amp:.1});
H.fill(circ(x+3.2,y-6.2,2.2,10),ink,.6);H.dot(x+3.8,y-6.6,.6,'blue',1);
H.line(R,[[x-4,y-1.5],[x-7,y+1.5]],'blue',1,{tone:.8,amp:.1})}
